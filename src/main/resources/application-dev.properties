spring.application.name=crudrest

# Configuracao do banco H2 (desenvolvimento) 
# URL do banco em memoria. O nome "cruddb" eh o identificador do banco.
# spring.datasource.url=jdbc:h2:mem:cruddb
# Banco ficara em um arquivo no diretorio onde roda a aplicacao
spring.datasource.url=jdbc:h2:file:./cruddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
 
# Dialeto SQL que o Hibernate deve usar para gerar queries compativeis com H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
 
# Estrategia de criacao do schema do banco:
# create-drop: cria as tabelas ao iniciar e as apaga ao encerrar a aplicacao
# update: atualiza o schema sem apagar os dados existentes
spring.jpa.hibernate.ddl-auto=create-drop
 
# Exibe no console os comandos SQL gerados pelo Hibernate (util para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
 
# Ativa o console web do H2 (acesse em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
