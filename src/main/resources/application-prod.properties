spring.application.name=crudrest

# Configuracao do SQL Server (producao)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=cruddb;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456
 
# Dialeto para SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
 
# Em producao utilize "validate" para nao alterar o schema acidentalmente
# ou "update" para permitir a adicao de novas colunas sem recriar as tabelas
spring.jpa.hibernate.ddl-auto=update
 
spring.jpa.show-sql=false